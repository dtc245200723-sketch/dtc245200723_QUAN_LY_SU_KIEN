{% extends 'events/base.html' %}

{% block title %}Chỉnh sửa sự kiện | EventHub{% endblock %}

{% block content %}
  <div class="row justify-content-center"><div class="col-lg-8">
    <section class="card-surface p-4 p-lg-5"><span class="eyebrow text-primary">{{ event.event_code }}</span><h1 class="h2 mt-2">Chỉnh sửa sự kiện</h1>
      <form method="post">{% csrf_token %}
        {% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button><a href="{% url 'event_detail' event.id %}" class="btn btn-outline-secondary ms-2">Hủy</a>
      </form>
    </section>
  </div></div>
{% endblock %}
